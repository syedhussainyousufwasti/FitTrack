<div class="auth-wrap">
  <div class="auth-left">
    <div>
      <div class="logo-text">FIT<br>TRACK</div>
      <p>Train Smarter. Live Better.</p>
      <div class="auth-stats">
        <div class="auth-stat">
          <div class="num">100+</div>
          <div class="lbl">Exercises</div>
        </div>
        <div class="auth-stat">
          <div class="num">∞</div>
          <div class="lbl">Goals</div>
        </div>
        <div class="auth-stat">
          <div class="num">24/7</div>
          <div class="lbl">Tracking</div>
        </div>
      </div>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-box">
      <h2>WELCOME BACK</h2>
      <p class="sub">Log in to your FitTrack account</p>

      <!-- Error message -->
      <div class="alert-error" ng-if="error">
        <i class="fas fa-circle-xmark"></i> {{error}}
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" ng-model="user.email" placeholder="you@gmail.com">
      </div>

      <div class="form-group">
        <label>PASSWORD</label>
        <div style="position:relative">
          <input type="{{showPass ? 'text' : 'password'}}" ng-model="user.password" placeholder="Min. 6 characters"
            style="padding-right:48px">
          <button type="button" ng-click="showPass = !showPass"
            style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:0">
            <i class="fas" ng-class="showPass ? 'fa-eye-slash' : 'fa-eye'"></i>
          </button>
        </div>
      </div>

      <button class="btn-primary" ng-click="login()" ng-disabled="loading">
        {{loading ? 'LOGGING IN...' : 'LOGIN'}}
      </button>

      <div class="auth-switch">
        New here?
        <a href="#!/register">Create an account</a>
      </div>
    </div>
  </div>
</div>
